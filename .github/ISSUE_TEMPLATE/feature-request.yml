name: Feature Request
description: Suggest an improvement or new feature for Trackstack
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What's the problem?
      description: A clear description of what you're trying to accomplish.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: How would you like this to work in Trackstack?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, examples from other tools, etc.
